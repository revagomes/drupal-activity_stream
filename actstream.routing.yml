actstream.default_page:
  path: '/actstream'
  defaults:
    _controller: '\Drupal\actstream\Controller\ActivityStreamController::defaultPage'
    _title: 'Activity Stream'
  requirements:
    _permission: 'access content'

actstream.user_page:
  path: '/user/{user}/actstream'
  defaults:
    _controller: '\Drupal\actstream\Controller\ActivityStreamController::userPage'
    _title_callback: '\Drupal\actstream\Controller\ActivityStreamController::userPageTitle'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      user:
        type: entity:user

entity.actstream_item.canonical:
  path: '/actstream/{actstream_item}'
  defaults:
    _entity_view: 'actstream_item'
    _title_callback: '\Drupal\Core\Entity\Controller\EntityController::title'
  requirements:
    _permission: 'access content'
    actstream_item: \d+
  options:
    parameters:
      actstream_item:
        type: entity:actstream_item

actstream.user_accounts:
  path: '/user/{user}/edit/actstream'
  defaults:
    _form: '\Drupal\actstream\Form\ActivityStreamAccountsForm'
    _title: 'Activity Stream accounts'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      user:
        type: entity:user

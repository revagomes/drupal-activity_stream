actstream.default_page:
  path: '/actstream'
  defaults:
    _controller: '\Drupal\actstream\Controller\ActivityStreamController::defaultPage'
    _title: 'Activity Stream'
  requirements:
    _permission: 'access content'

actstream.user_page:
  path: '/user/{user}/actstream'
  defaults:
    _controller: '\Drupal\actstream\Controller\ActivityStreamController::userPage'
    _title_callback: '\Drupal\actstream\Controller\ActivityStreamController::userPageTitle'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      user:
        type: entity:user

actstream.user_accounts:
  path: '/user/{user}/edit/actstream'
  defaults:
    _form: '\Drupal\actstream\Form\ActivityStreamAccountsForm'
    _title: 'Activity Stream accounts'
  requirements:
    _permission: 'access content'
  options:
    parameters:
      user:
        type: entity:user

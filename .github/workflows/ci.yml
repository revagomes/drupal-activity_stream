name: CI

on:
  push:
    branches: ['2.0.x']
  pull_request:
    branches: ['2.0.x']

jobs:
  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP lint
        run: find src actstream.module actstream.install actstream_feed/actstream_feed.module actstream_twitter/actstream_twitter.module actstream_facebook_page/actstream_facebook_page.module actstream_facebook_page/src -name '*.php' -exec php -l {} \;

      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist
